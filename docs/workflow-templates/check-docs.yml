# Template only. Activate by placing at .github/workflows/check-docs.yml with an authorized account.
name: Check research documents
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref inspected 2026-10-12
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 ref inspected 2026-10-12
        with:
          python-version: '3.12'
      - name: Validate documentation
        run: python scripts/validate_docs.py
